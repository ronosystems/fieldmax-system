{% extends 'shops/base.html' %}

{% block title %}Edit Branch - {{ branch.name }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2>
                <i class="fas fa-edit me-2"></i>Edit Branch: {{ branch.name }}
            </h2>
            <p class="text-muted">Update shop branch information</p>
        </div>
        <div class="col-md-4 text-end">
            <a href="{% url 'shops:branches' %}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back to Branches
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="id_name" class="form-label">Branch Name *</label>
                        <input type="text" name="name" id="id_name" class="form-control" value="{{ branch.name }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="id_code" class="form-label">Branch Code *</label>
                        <input type="text" name="code" id="id_code" class="form-control" value="{{ branch.code }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="id_location" class="form-label">Location *</label>
                        <input type="text" name="location" id="id_location" class="form-control" value="{{ branch.location }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="id_manager" class="form-label">Manager Name *</label>
                        <input type="text" name="manager" id="id_manager" class="form-control" value="{{ branch.manager }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="id_phone" class="form-label">Phone Number *</label>
                        <input type="text" name="phone" id="id_phone" class="form-control" value="{{ branch.phone }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" id="id_email" class="form-control" value="{{ branch.email }}">
                    </div>
                    <div class="col-12 mb-3">
                        <div class="form-check">
                            <input type="checkbox" name="is_active" id="id_is_active" class="form-check-input" {% if branch.is_active %}checked{% endif %}>
                            <label for="id_is_active" class="form-check-label">Active</label>
                        </div>
                    </div>
                </div>
                <div class="text-end">
                    <a href="{% url 'shops:branches' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
